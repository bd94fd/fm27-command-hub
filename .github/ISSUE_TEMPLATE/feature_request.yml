name: Feature request
description: Suggest a change that makes the app safer, clearer, or faster.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are reviewed against `ROADMAP.md`. A request is not a promise to build it, and new ideas are added to the roadmap rather than kept only in an issue.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user problem before the proposed solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: A small, concrete change is easier to evaluate than a full redesign.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Save import or restore
        - Hub and finances
        - Squad
        - Staff
        - Tactics and corners
        - Transfers and scouting
        - Matches
        - Analyst chat
        - Install or offline mode
        - Accessibility
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workaround or simpler option you have tried.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not attached a save file, API key, token, or personal data.
          required: true
