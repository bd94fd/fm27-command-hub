name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Compile-check Python .fm save scripts
        run: python3 -m py_compile public/*.py

      - name: Run Python unit tests (if present)
        run: |
          if [ -d tests/python ]; then
            python3 -m unittest discover -s tests/python -v
          else
            echo "No tests/python directory yet; skipping."
          fi

      - name: TypeScript type-check
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Publish bundle size summary
        run: |
          {
            echo "### Production Bundle Summary"
            echo ""
            echo "| File | Size |"
            echo "| :--- | ---: |"
            find dist -type f | sort | while read -r f; do
              size=$(du -h "$f" | cut -f1)
              echo "| \`$f\` | $size |"
            done
            echo ""
            echo "**Total \`dist/\` size:** $(du -sh dist | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

