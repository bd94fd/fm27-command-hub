name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roadmap:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a roadmap item
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          combined="$PR_TITLE"$'\n'"$PR_BODY"
          if ! printf '%s\n' "$combined" | grep -Eiq 'Roadmap:[[:space:]]*R[0-9]{2}'; then
            echo "::error::Add a roadmap item to the PR title or body, for example: Roadmap: R25"
            exit 1
          fi
          printf '%s\n' "$combined" | grep -Eio 'Roadmap:[[:space:]]*R[0-9]{2}' | head -n 1

      - name: Dependabot exemption
        if: ${{ github.actor == 'dependabot[bot]' }}
        run: echo "Dependabot PRs are exempt from the roadmap check."

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile-check Python .fm save scripts
        run: python3 -m py_compile public/*.py

      - name: Run Python unit tests (if present)
        run: |
          if [ -d tests/python ]; then
            python3 -m unittest discover -s tests/python -v
          else
            echo "No tests/python directory yet; skipping."
          fi

      - name: TypeScript type-check
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Publish bundle size summary
        run: |
          {
            echo "### Production Bundle Summary"
            echo ""
            echo "| File | Size |"
            echo "| :--- | ---: |"
            find dist -type f | sort | while read -r f; do
              size=$(du -h "$f" | cut -f1)
              echo "| \`$f\` | $size |"
            done
            echo ""
            echo "**Total \`dist/\` size:** $(du -sh dist | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

