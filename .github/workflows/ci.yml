name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roadmap:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a roadmap item
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          combined="$PR_TITLE"$'\n'"$PR_BODY"
          if ! printf '%s\n' "$combined" | grep -Eiq 'Roadmap:[[:space:]]*R[0-9]{2}'; then
            echo "::error::Add a roadmap item to the PR title or body, for example: Roadmap: R25"
            exit 1
          fi
          printf '%s\n' "$combined" | grep -Eio 'Roadmap:[[:space:]]*R[0-9]{2}' | head -n 1

      - name: Dependabot exemption
        if: ${{ github.actor == 'dependabot[bot]' }}
        run: echo "Dependabot PRs are exempt from the roadmap check."

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile-check Python .fm save scripts
        run: python3 -m py_compile public/*.py

      - name: Run Python unit tests (if present)
        run: |
          if [ -d tests/python ]; then
            python3 -m unittest discover -s tests/python -v
          else
            echo "No tests/python directory yet; skipping."
          fi

      - name: Type-check and lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check upstream fmsave (informational)
        continue-on-error: true
        run: npm run check:fmsave

      - name: Run unit test suite
        run: npm test

      - name: Run test coverage gate
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Service worker precaches the app shell
        run: npm run verify:precache

      - name: Publish bundle size summary
        run: |
          {
            echo "### Production Bundle Summary"
            echo ""
            echo "| File | Size |"
            echo "| :--- | ---: |"
            find dist -type f | sort | while read -r f; do
              size=$(du -h "$f" | cut -f1)
              echo "| \`$f\` | $size |"
            done
            echo ""
            echo "**Total \`dist/\` size:** $(du -sh dist | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

  real-save-regression:
    if: ${{ vars.FM27_REAL_SAVE_DIR != '' && vars.FM27_REAL_SAVE_RUNNER != '' }}
    runs-on: ${{ vars.FM27_REAL_SAVE_RUNNER }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pinned fmsave
        run: python -m pip install --disable-pip-version-check fmsave==0.14.5

      - name: Decode real saves against the fingerprint manifest
        env:
          FM27_REAL_SAVE_DIR: ${{ vars.FM27_REAL_SAVE_DIR }}
          FM27_REAL_SAVE_REQUIRED: '1'
        run: python -m unittest tests.python.test_real_save_regression -v
